name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements.txt is deliberately not installed: the tests cover
      # PDF extraction and classification, for which PyMuPDF is enough.
      # Downloading two gigabytes of torch for them would stretch the run
      # into minutes without adding a single test.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The golden test (tests/test_pipeline_golden.py) skips itself here:
      # it needs the source PDF, which does not belong in the repository
      # for rights reasons. Run it locally, see the README.
      - name: Test
        run: pytest -q
