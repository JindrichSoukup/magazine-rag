[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magrag"
version = "0.2.0"
description = "A magazine PDF archive -> structured corpus -> RAG, with swappable source profiles"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jindřich Soukup" }]

# Runtime dependencies are deliberately only those for PDF extraction:
# anyone who wants to study the parsing need not download two gigabytes
# of torch. The rest is in extras, and pinned in requirements.txt.
dependencies = ["PyMuPDF>=1.25"]

[project.optional-dependencies]
embed = ["sentence-transformers>=5", "torch>=2", "numpy>=1.26", "chromadb>=1.5"]
answer = ["anthropic>=1.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["magrag*"]

[tool.setuptools.package-data]
"magrag.profiles" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
